          };
        });
      });

      const winnerGroup = groups[0] || { members: [] };
      const winnerShare = winnerGroup.members.length ? winnerAmount / winnerGroup.members.length : 0;
      winnerGroup.members.forEach((player) => {
        byIndex[player.index].receive = winnerShare;
      });

      return {
        byIndex,
        winnerAmount,
        winnerShare,
        winnerNames: winnerGroup.members.map((player) => player.name),
        winnerCount: winnerGroup.members.length
      };
    }

    function winnerAmountFor(record) {
      if (!record || !record.ranked || !record.ranked.length) return 0;
      return payoutDetails(record.ranked, record.payments || []).winnerAmount;
    }

    function recordPot(record) {
      return record.winnerAmount != null ? record.winnerAmount : winnerAmountFor(record);
    }

    function placeLabelFor(detail) {
      return `${ordinal(detail.place)}${detail.tied ? "=" : ""}`;
    }

    function buildRecord(game, rounds, winnerIndex = null) {
      const totals = computeTotals(game.players.length, rounds);
      const ranked = rankedPlayers(game.players, totals, winnerIndex);
      const paymentValues = game.payments.map((payment) => asNumber(payment, 0));
      const payout = payoutDetails(ranked, paymentValues);
      return {
        id: Date.now(),
        date: new Date().toISOString(),
        target: game.target,
        players: game.players,
        rounds: rounds.map(normalizeRound),
        totals,
        payments: paymentValues,
        ranked,
        wonBy: winnerIndex != null ? "run" : "points",
        winner: payout.winnerNames.join(" & "),
        winnerAmount: payout.winnerAmount,
        winnerShare: payout.winnerShare
      };
    }

    function computeStats(history) {
      const byName = new Map();
      history.forEach((game) => {
        const ranked = game.ranked || [];
        if (!ranked.length) return;
        const payout = payoutDetails(ranked, game.payments || []);
        ranked.forEach((player) => {
          const key = String(player.name || "").trim().toLowerCase();
          if (!key) return;
          const entry = byName.get(key) || { name: player.name, games: 0, wins: 0, points: 0, best: 0, net: 0 };
          const detail = payout.byIndex[player.index] || { place: 99, pay: 0, receive: 0 };
          entry.games += 1;
          entry.points += player.total || 0;
          entry.best = Math.max(entry.best, player.total || 0);
          entry.net += (detail.receive || 0) - (detail.pay || 0);
          if (detail.place === 0) entry.wins += 1;
          byName.set(key, entry);
        });
      });
      return Array.from(byName.values()).sort((a, b) => b.net - a.net || b.wins - a.wins || a.name.localeCompare(b.name));
    }

    function scoreSheetText(record) {
      const payout = payoutDetails(record.ranked, record.payments || []);
      const lines = [
        "CARD GAME CALCULATOR",
        "====================",
        "",
        `Date: ${new Date(record.date).toLocaleString()}`,
        `Target: ${record.target}`,
        `Rounds: ${record.rounds.length}`,
        `Winner: ${record.winner}${record.wonBy === "run" ? " (A to K run)" : ""}`,
        `Pot: ${money(recordPot(record))}`,
        "",
        "Standings:"
      ];
      record.ranked.forEach((player) => {
        const detail = payout.byIndex[player.index] || { place: 0, pay: 0, receive: 0, tied: false };
        const amountText = detail.place === 0 ? `receives ${money(detail.receive)}` : `pays ${money(detail.pay)}`;
        lines.push(`${placeLabelFor(detail)} - ${player.name}: ${player.total} pts (${amountText})`);
      });
      lines.push("", "Round data:");
      lines.push(["Round", ...record.players.map((player) => player.name), "Special hand"].join("\t"));
      record.rounds.forEach((round, index) => {
        const hand = eventHand(round);
        const event = roundEvent(round);
        const note = hand && event ? `${hand.label} - ${record.players[event.player] ? record.players[event.player].name : ""}` : "";
        lines.push([index + 1, ...roundScores(round), note].join("\t"));
      });
      lines.push(["Total", ...record.totals, ""].join("\t"));
      return lines.join("\n");
    }

    function downloadRecord(record) {
      if (!record || !record.players || !record.players.length) return;
      const blob = new Blob([scoreSheetText(record)], { type: "text/plain" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = `card-game-${new Date(record.date).toISOString().slice(0, 10)}.txt`;
      document.body.appendChild(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(url);
    }

    /* ---------- routing ---------- */

    function parseHash() {
      const parts = (window.location.hash || "").replace(/^#\/?/, "").split("/").filter(Boolean);
      return { name: parts[0] || "home", param: parts[1] || null };
    }

    function navigate(path) {
      if (window.location.hash === path) return;
      window.location.hash = path;
    }

    function useRoute() {
      const [route, setRoute] = useState(parseHash);
      useEffect(() => {
        const onChange = () => {
          setRoute(parseHash());
          window.scrollTo({ top: 0, behavior: "auto" });
        };
        window.addEventListener("hashchange", onChange);
        return () => window.removeEventListener("hashchange", onChange);
      }, []);
      return route;
    }

    /* ---------- shared UI ---------- */

    /* One colour per seat, shared by the avatar, the name and the box. */
    function tone(index) {
      return `p${index % avatarClasses.length}`;
    }

    function Avatar({ name, index, size }) {
      const initial = (name || "").trim().slice(0, 1).toUpperCase() || String.fromCharCode(65 + (index || 0));
      return h("div", { className: `avatar ${size === "sm" ? "sm " : ""}${avatarClasses[index % avatarClasses.length]}`, "aria-hidden": "true" }, initial);
    }

    function Button({ children, className = "", ...props }) {
      return h("button", { type: "button", className: `btn ${className}`, ...props }, children);
    }

    function Empty({ icon, title, body, action }) {
      return h("div", { className: "empty" },
        h("i", { "aria-hidden": "true" }, icon),
        h("strong", null, title),
        body ? h("p", null, body) : null,
        action || null
      );
    }

    function EventPill({ round, players }) {
      const hand = eventHand(round);
      const event = roundEvent(round);
      if (!hand || !event) return null;
      const player = players[event.player];
      const awarded = asNumber(roundScores(round)[event.player], 0);
      return h("span", { className: `event-pill ${hand.wins ? "win" : ""}` },
        h("span", { className: "sym" }, hand.symbol),
        `${hand.label}${player ? ` · ${player.name}` : ""} +${awarded}${hand.wins ? " · wins" : ""}`
      );
    }

    function HandLegend({ rounds }) {
      const used = specialHands.filter((hand) => rounds.some((round) => roundEvent(round) && roundEvent(round).type === hand.type));
      if (!used.length) return null;
      return h("div", { className: "legend" }, used.map((hand) =>
        h("span", { key: hand.type }, h("b", null, hand.symbol), hand.toTarget ? `${hand.label} (to target)` : `${hand.label} (+${hand.points})`)
      ));
    }

    function Modal({ open, title, body, confirmLabel = "Confirm", danger, onConfirm, onCancel }) {
      useEffect(() => {
        if (!open) return undefined;
        const onKey = (event) => { if (event.key === "Escape") onCancel(); };
        window.addEventListener("keydown", onKey);
        return () => window.removeEventListener("keydown", onKey);
      }, [open, onCancel]);

      if (!open) return null;
      return h("div", { className: "modal-backdrop", onClick: onCancel },
        h("div", { className: "modal", role: "dialog", "aria-modal": "true", "aria-label": title, onClick: (event) => event.stopPropagation() },
          h("h3", null, title),
          body ? h("p", null, body) : null,
          h("div", { className: "row" },
            h(Button, { className: "ghost", onClick: onCancel }, "Cancel"),
            h(Button, { className: danger ? "danger" : "primary", onClick: onConfirm }, confirmLabel)
          )
        )
      );
    }

    /* ---------- navigation ---------- */

    const navItems = [
      { key: "home", href: "#/", icon: "♠", label: "Home" },
      { key: "game", href: "#/game", icon: "▶", label: "Game" },
      { key: "history", href: "#/history", icon: "↺", label: "History" },
      { key: "stats", href: "#/stats", icon: "★", label: "Stats" },
      { key: "rules", href: "#/rules", icon: "?", label: "Rules" }
    ];

    function AppBar({ route, theme, onToggleTheme }) {
      return h("header", { className: "appbar" },
        h("div", { className: "appbar-inner" },

    function SetupPage({ onStart, hasLiveGame, lastGame, recentNames }) {

      });
      const [payments, setPayments] = useState(() => {
        const seed = ["", "", ""];

        return seed;
      });
      const [errors, setErrors] = useState({});
      const [prefilled, setPrefilled] = useState(Boolean(lastGame));

      /* Names already on the sheet shouldn't show up again in the quick-add row. */
      const usedNames = new Set(names.slice(0, playerCount).map((name) => name.trim().toLowerCase()).filter(Boolean));
      const suggestions = (recentNames || []).filter((name) => !usedNames.has(name.toLowerCase())).slice(0, 8);
      const firstEmpty = names.slice(0, playerCount).findIndex((name) => !name.trim());

      function applyLastGame() {
        if (!lastGame) return;
        setPlayerCount(lastGame.players.length);
        setTarget(String(lastGame.target));
        setNames(["", "", "", ""].map((_, index) => (lastGame.players[index] ? lastGame.players[index].name : "")));
        setPayments(["", "", ""].map((_, index) => {
          const amount = (lastGame.payments || [])[index];
          return amount == null ? "" : String(amount);
        }));
        setErrors({});
        setPrefilled(true);
      }

      function clearAll() {
        setNames(["", "", "", ""]);
        setPayments(["", "", ""]);
        setErrors({});
        setPrefilled(false);
      }

      function addSuggestion(name) {
        if (firstEmpty < 0) return;
        updateName(firstEmpty, name);
      }

      const activeNames = names.slice(0, playerCount);
      const trimmed = activeNames.map((name) => name.trim());
      const duplicate = trimmed.some((name, index) => name && trimmed.findIndex((other) => other.toLowerCase() === name.toLowerCase()) !== index);

      function updateName(index, value) {
        setNames((current) => current.map((name, position) => position === index ? value : name));
      }

      function updatePayment(index, value) {
        setPayments((current) => current.map((payment, position) => position === index ? value : payment));
      }

      function submit() {
        const nextErrors = {};
        trimmed.forEach((name, index) => {
          if (!name) nextErrors[`name${index}`] = "Enter a name";
        });
        const targetValue = Math.round(asNumber(target, 0));
        if (!targetValue || targetValue < 5) nextErrors.target = "Target must be at least 5";
        const activePayments = payments.slice(0, playerCount - 1);

          const value = Number(payment);

        });
        setErrors(nextErrors);
        if (Object.keys(nextErrors).length) return;

        onStart({
          target: targetValue,
          players: trimmed.map((name) => ({ name, initial: name.slice(0, 1).toUpperCase() })),
          payments: activePayments.map((payment) => Number(payment)),
          rounds: [],
          startedAt: new Date().toISOString()

                ? h(Button, { className: "ghost block", onClick: clearAll }, "Clear and start fresh")

          : null,

        hasLiveGame
          ? h("div", { className: "resume-card", style: { marginTop: 0, marginBottom: 14 } },

        h("div", { className: "card" },
          h("div", { className: "card-body stack" },
            h("div", null,
              h("span", { className: "section-label" }, "Number of players"),
              h("div", { className: "segmented" }, [2, 3, 4].map((count) =>
                h("button", {
                  key: count,

                  onClick: () => setPlayerCount(count)
                }, `${count} players`)
              ))
            ),

            h("div", { className: "field" },
              h("label", { htmlFor: "target" }, "Winning target"),
              h("input", {
                id: "target",

                min: 5,

                onChange: (event) => setTarget(event.target.value)
              }),
              errors.target ? h("div", { className: "field-error" }, errors.target) : h("div", { className: "hint" }, "The game ends as soon as any player reaches this score.")
            ),

            h("div", null,

                h("div", { className: "player-row", key: index },

                )

            ),

          )

    /* ---------- position chart ----------
       Y is points, X is the round, so the line shows the real gap between
       players. Each point is stamped with the card for that player's place
       after that round — A 1st, K 2nd, Q 3rd, J 4th. Colour follows the
       player, never their rank. */

    const rankCards = ["A", "K", "Q", "J"];
    const CHART_ROUND_WINDOW = 10;

    function niceScale(min, max, target) {
      const lo = Math.min(0, min);
      const hi = Math.max(max, target);
      const span = Math.max(1, hi - lo);
      const raw = span / 4;
      const mag = Math.pow(10, Math.floor(Math.log10(raw)));
      const norm = raw / mag;
      const step = (norm <= 1 ? 1 : norm <= 2 ? 2 : norm <= 5 ? 5 : 10) * mag;
      const start = Math.floor(lo / step) * step;
      const end = Math.ceil(hi / step) * step;
      const ticks = [];
      for (let v = start; v <= end + step / 1000; v += step) ticks.push(Math.round(v));
      return { ticks, min: start, max: end };
    }

    function useElementWidth(ref, initial = 320) {
      const [width, setWidth] = useState(initial);
      useEffect(() => {
        const node = ref.current;
        if (!node) return undefined;
        const measure = () => setWidth(Math.max(240, node.clientWidth));
        measure();
        if (typeof ResizeObserver === "undefined") {
          window.addEventListener("resize", measure);
          return () => window.removeEventListener("resize", measure);
        }
        const observer = new ResizeObserver(measure);
        observer.observe(node);
        return () => observer.disconnect();
      }, [ref]);
      return width;
    }

    function PositionChart({ players, byRound, target, animKey, crowned }) {
      const wrapRef = useRef(null);
      const width = useElementWidth(wrapRef);
      const [active, setActive] = useState(null);

      const total = byRound.length;
      const start = Math.max(0, total - CHART_ROUND_WINDOW);
      const shown = byRound.slice(start);
      if (!shown.length) return null;

      const narrow = width < 400;
      const padLeft = 36;
      const padRight = narrow ? 60 : 92;
      const padTop = 22;
      const padBottom = 34;
      const plotW = Math.max(60, width - padLeft - padRight);
      const plotH = (narrow ? 232 : 270) + Math.max(0, players.length - 2) * 16;
      const height = padTop + plotH + padBottom;

      const allTotals = shown.reduce((acc, stand) => acc.concat(stand.totals), []);
      const scale = niceScale(Math.min.apply(null, allTotals), Math.max.apply(null, allTotals), target);
      const cardW = 18, cardH = 24;
      /* Two passes: size the fan from the room a round gets, then inset the
         plot far enough that a fanned card never reaches the axis labels. */
      const roughStep = shown.length > 1 ? Math.max(0, plotW - 40) / (shown.length - 1) : plotW;
      const room = players.length > 1 ? (roughStep - cardW - 4) / (players.length - 1) : cardW;
      const fanStep = Math.min(cardW + 3, Math.max(10, room));
      const maxFan = players.length > 1 ? ((players.length - 1) / 2) * fanStep : 0;
      const inset = Math.max(20, maxFan + cardW / 2 + 6);
      const span = Math.max(0, plotW - inset * 2);
      const stepX = shown.length > 1 ? span / (shown.length - 1) : 0;

      const xAt = (i) => padLeft + inset + (shown.length > 1 ? i * stepX : span / 2);
      const yAt = (points) => padTop + plotH - ((points - scale.min) / (scale.max - scale.min)) * plotH;


      /* Players on similar points would stack their cards on top of each other,
         so cards that collide vertically fan out sideways like a held hand.
         The vertical position — the actual score — is never moved. */
      const markerAt = shown.map((stand, i) => {
        const rows = players
          .map((_, idx) => ({ idx, y: yAt(stand.totals[idx]) }))
          .sort((a, b) => a.y - b.y);
        const groups = [];
        rows.forEach((row) => {
          const group = groups[groups.length - 1];
          if (group && row.y - group[group.length - 1].y < cardH + 2) group.push(row);
          else groups.push([row]);
        });
        const out = new Array(players.length);
        groups.forEach((group) => {
          group.forEach((row, k) => {
            const offset = group.length === 1 ? 0 : (k - (group.length - 1) / 2) * fanStep;
            out[row.idx] = { x: xAt(i) + offset, y: row.y };
          });
        });
        return out;
      });

      /* End labels get nudged apart too — they annotate, they do not encode. */
      const lastStand = shown[shown.length - 1];
      const endLabels = players
        .map((player, idx) => ({ idx, player, y: yAt(lastStand.totals[idx]) }))
        .sort((a, b) => a.y - b.y);
      let lastY = -Infinity;
      endLabels.forEach((label) => {
        label.ly = Math.max(label.y, lastY + 14);
        lastY = label.ly;
      });

      const activeIndex = active == null ? shown.length - 1 : active;
      const activeStand = shown[activeIndex];
      const targetInView = target <= scale.max && target >= scale.min;

      return h("div", { className: "chart-wrap", ref: wrapRef },
        h("svg", {
          className: "chart",
          width: "100%",
          height,
          viewBox: `0 0 ${Math.max(width, 240)} ${height}`,
          role: "img",
          "aria-label": `Points after each round for ${players.map((p) => p.name).join(", ")}. The same figures are in the round history.`
        },
          scale.ticks.map((tick) => h("line", {
            key: `g${tick}`,
            className: "chart-grid",
            x1: padLeft, x2: padLeft + plotW, y1: yAt(tick), y2: yAt(tick)
          })),

          scale.ticks.map((tick) => h("text", {
            key: `t${tick}`,
            className: "chart-ylabel",
            x: padLeft - 8, y: yAt(tick) + 4, textAnchor: "end"
          }, tick)),

          /* the finish line */
          targetInView ? h("line", {
            className: "chart-target",
            x1: padLeft, x2: padLeft + plotW, y1: yAt(target), y2: yAt(target)
          }) : null,
          targetInView ? h("text", {
            className: "chart-target-label",
            x: padLeft + 3, y: yAt(target) - 7, textAnchor: "start"
          }, `🏁 Target ${target}`) : null,

          h("line", {
            className: "chart-cross",
            x1: xAt(activeIndex), x2: xAt(activeIndex), y1: padTop - 8, y2: padTop + plotH + 6
          }),

          shown.map((_, i) => {
            const every = shown.length > 7 ? 2 : 1;
            if (i % every !== 0 && i !== shown.length - 1) return null;
            return h("text", {
              key: `x${i}`, className: "chart-xlabel",
              x: xAt(i), y: padTop + plotH + 22, textAnchor: "middle"
            }, `R${start + i + 1}`);
          }),

          h("g", { key: animKey, className: "chart-series" },
            players.map((player, index) => {
              const points = shown.map((stand, i) => `${xAt(i)},${yAt(stand.totals[index])}`).join(" ");
              return h("g", { key: `s${index}`, className: `chart-line ${tone(index)}`, style: { "--d": `${index * 80}ms` } },
                shown.length > 1 ? h("polyline", { className: "chart-halo", points, pathLength: "1" }) : null,
                shown.length > 1 ? h("polyline", { className: "chart-stroke", points, pathLength: "1" }) : null
              );
            }),

            /* cards deal round by round, so the game replays as you watch */
            players.map((player, index) => shown.map((stand, i) => {
              const place = stand.places[index].place;
              const spot = markerAt[i][index];
              const cx = spot.x;
              const cy = spot.y;
              const w = cardW, ht = cardH;
              return h("g", {
                key: `m${index}-${i}`,
                className: `chart-card ${tone(index)}${place === 0 ? " lead" : ""}`,
                style: { "--d": `${520 + i * 130 + index * 34}ms` }
              },
                h("rect", { className: "chart-card-ring", x: cx - w / 2 - 2, y: cy - ht / 2 - 2, width: w + 4, height: ht + 4, rx: 6 }),
                h("rect", { className: "chart-card-face", x: cx - w / 2, y: cy - ht / 2, width: w, height: ht, rx: 4 }),
                h("text", { className: "chart-card-text", x: cx, y: cy + 4.5, textAnchor: "middle" },
                  rankCards[place] || String(place + 1))
              );
            })),

            /* the latest round carries each player's running total, so the
               scores can be read straight off the chart */
            endLabels.map((label) => {
              const cap = narrow ? 6 : 8;
              const name = label.player.name;
              const short = name.length > cap ? `${name.slice(0, cap - 1)}…` : name;
              return h("text", {
                key: `l${label.idx}`,
                className: `chart-endlabel ${tone(label.idx)}`,
                x: xAt(shown.length - 1) + maxFan + 13,
                y: label.ly + 4
              },
                h("tspan", null, short),
                h("tspan", { className: "chart-endpts" }, ` ${lastStand.totals[label.idx]}`)
              );
            }),

            crowned && crowned.size
              ? players.map((player, index) => {
                  if (!crowned.has(index)) return null;
                  const spot = markerAt[shown.length - 1][index];
                  return h("text", {
                    key: `crown${index}`,
                    className: "chart-crown",
                    x: spot.x, y: spot.y - cardH / 2 - 8,
                    textAnchor: "middle"
                  }, "\uD83D\uDC51");
                })
              : null
          ),

          shown.map((_, i) => h("rect", {
            key: `h${i}`, className: "chart-hit",
            x: xAt(i) - Math.max(16, stepX / 2), y: 0,
            width: Math.max(32, stepX || plotW), height,
            tabIndex: 0, role: "button",
            "aria-label": `Round ${start + i + 1}`,
            onMouseEnter: () => setActive(i),
            onMouseLeave: () => setActive(null),
            onFocus: () => setActive(i),
            onBlur: () => setActive(null)
          }))
        ),

        activeStand
          ? h("div", { className: "chart-readout" },
              h("span", { className: "chart-readout-round" }, `Round ${start + activeIndex + 1}`),
              players
                .map((player, index) => ({ player, index, place: activeStand.places[index].place, points: activeStand.totals[index] }))
                .sort((a, b) => a.place - b.place || a.index - b.index)
                .map((row) => h("span", { className: `chart-readout-item ${tone(row.index)}`, key: row.index },
                  h("b", null, rankCards[row.place] || row.place + 1),
                  row.player.name,
                  h("i", null, `${row.points}`)
                ))
            )
          : null,

        start > 0 ? h("p", { className: "chart-note" }, `Showing the last ${CHART_ROUND_WINDOW} rounds.`) : null
      );
    }

    /* The chart lives in a popup so the animation gets the whole screen. */
    const CHART_AUTO_CLOSE_MS = 20000;

    function ChartModal({ open, game, byRound, animKey, onClose }) {
      const [counting, setCounting] = useState(true);
      const timer = useRef(null);

      useEffect(() => {
        if (!open) return undefined;
        const onKey = (event) => { if (event.key === "Escape") onClose(); };
        window.addEventListener("keydown", onKey);
        const previous = document.body.style.overflow;
        document.body.style.overflow = "hidden";
        return () => {
          window.removeEventListener("keydown", onKey);
          document.body.style.overflow = previous;
        };
      }, [open, onClose]);

      /* It closes itself so play can carry on, but anyone who starts reading
         the chart keeps it open. */
      useEffect(() => {
        if (!open) return undefined;
        setCounting(true);
        timer.current = setTimeout(onClose, CHART_AUTO_CLOSE_MS);
        return () => clearTimeout(timer.current);
      }, [open, onClose]);

      const hold = useCallback(() => {
        clearTimeout(timer.current);
        setCounting(false);
      }, []);

      if (!open) return null;
      const roundNo = game.rounds.length;

      return h("div", { className: "chart-scrim", onClick: onClose },
        h("div", {
          className: "chart-modal",
          role: "dialog",
          "aria-modal": "true",
          "aria-label": "Position tracker",
          onClick: (event) => event.stopPropagation(),
          onPointerDown: hold,
          onMouseMove: hold,
          onKeyDown: hold
        },
          counting
            ? h("div", { className: "chart-countdown", "aria-hidden": "true" },
                h("i", { style: { animationDuration: `${CHART_AUTO_CLOSE_MS}ms` } }))
            : null,
          h("div", { className: "chart-modal-head" },
            h("div", { className: "grow" },
              h("h3", null, roundNo ? `After round ${roundNo}` : "Position tracker"),
              h("p", null, "Points after each round · the card shows their place")
            ),
            h("button", {
              type: "button", className: "chart-close",
              onClick: onClose, "aria-label": "Close chart"
            }, "✕")
          ),

          h("div", { className: "chart-legend" }, game.players.map((player, index) =>
            h("span", { className: `chart-legend-item ${tone(index)}`, key: index },
              h("i", { "aria-hidden": "true" }), player.name)
          )),

          h(PositionChart, { players: game.players, byRound, target: game.target, animKey }),

          h("div", { className: "chart-modal-foot" },
            h("p", { className: "chart-key" },
              h("b", null, "A"), " 1st ", h("b", null, "K"), " 2nd ",
              h("b", null, "Q"), " 3rd ", h("b", null, "J"), " 4th",
              counting ? h("span", { className: "chart-auto" }, " · closes on its own") : null),
            h(Button, { className: "primary", onClick: onClose }, "Back to the game")
          )
        )
      );
    }

    /* The live board: standings and round history. Score entry lives on its own page. */
    function BoardPage({ game, onUpdateRound, onDeleteRound, onFinish, onAbandon, notify, lastRoundAt }) {
      const [editing, setEditing] = useState(null);
      const [editValues, setEditValues] = useState([]);
      const [editError, setEditError] = useState("");
      const [chartOpen, setChartOpen] = useState(false);
      const [animKey, setAnimKey] = useState(0);

      const totals = useMemo(() => computeTotals(game.players.length, game.rounds), [game.players.length, game.rounds]);
      const ranking = useMemo(() => rankedPlayers(game.players, totals), [game.players, totals]);
      const payout = useMemo(() => payoutDetails(ranking, game.payments), [ranking, game.payments]);
      const byRound = useMemo(() => standingsByRound(game.players.length, game.rounds), [game.players.length, game.rounds]);

      /* Saving a round throws the chart up as a popup so the animation plays
         front and centre; the viewer closes it with the cross. */
      useEffect(() => {
        if (!lastRoundAt || !game.rounds.length) return;
        setAnimKey((key) => key + 1);
        setChartOpen(true);
      }, [lastRoundAt]);

      function openChart() {
        setAnimKey((key) => key + 1);
        setChartOpen(true);
      }
      const leader = ranking[0];
      const nextRound = game.rounds.length + 1;

      function startEdit(roundIndex) {
        setEditing(roundIndex);
        setEditError("");
        setEditValues(roundScores(game.rounds[roundIndex]).map((score) => String(score)));
      }

      function saveEdit() {
        const scores = game.players.map((_, index) => Math.round(asNumber(editValues[index], 0)));
        if (scores.every((score) => score === 0)) {
          setEditError("A round can't be all zeros. Enter at least one score or delete the round.");
          return;
        }
        setEditing(null);
        onUpdateRound(editing, scores);
        notify(`Round ${editing + 1} updated`);
      }

      function removeRound(roundIndex) {
        setEditing(null);
        onDeleteRound(roundIndex);
      }

      const cta = h("div", { className: "cta-bar" },
        h(Button, { className: "primary block lg", onClick: () => navigate("#/game/score") }, `Enter round ${nextRound} scores`)
      );

      return h(React.Fragment, null,
        h("h2", { className: "page-title" }, game.rounds.length ? `After round ${game.rounds.length}` : "Ready to play"),
        h("p", { className: "page-sub" },
          game.rounds.length && leader
            ? `${leader.name} leads with ${leader.total} · first to ${game.target} wins the pot.`
            : `First to ${game.target} points wins the pot.`),

        h("div", { className: "target-bar" },
          h("div", null, h("small", null, "Target"), h("b", null, game.target)),
          h("div", null, h("small", null, "Rounds"), h("b", null, game.rounds.length)),
          h("div", null, h("small", null, "Leader"), h("b", { title: leader ? leader.name : undefined }, leader && game.rounds.length ? leader.name : "—")),
          h("div", null, h("small", null, "Pot"), h("b", null, money(payout.winnerAmount)))
        ),

        cta,

        h("div", { className: "board" },
          h("section", { className: "card" },
            h("div", { className: "card-head" },
              h("div", null,
                h("h3", { className: "card-title" }, "Standings"),
                h("p", { className: "card-sub" }, "Where everyone lands if the game ended right now.")
              )
            ),
            h("div", { className: `card-body standings-grid cols-${game.players.length}` }, ranking.map((player) => {
              const total = totals[player.index] || 0;
              const percent = Math.max(0, Math.min(100, Math.round((total / game.target) * 100)));
              const detail = payout.byIndex[player.index] || { place: 0, pay: 0, receive: 0, tied: false };
              const isLeader = detail.place === 0 && game.rounds.length > 0;
              return h("article", { className: `stand-box ${tone(player.index)} ${isLeader ? "leader" : ""}`, key: player.index },
                h("div", { className: "stand-top" },
                  h("span", { className: "stand-place" }, placeLabelFor(detail)),
                  isLeader ? h("span", { className: "stand-crown", "aria-label": "Leading" }, "👑") : null
                ),
                h(Avatar, { name: player.name, index: player.index }),
                h("div", { className: "stand-name", title: player.name }, player.name),
                h("div", { className: "stand-score" }, total),
                h("div", { className: "progress" }, h("span", { style: { width: `${percent}%` } })),
                h("div", { className: "stand-togo" }, `${Math.max(0, game.target - total)} to go`),
                h("div", { className: `stand-money ${detail.place === 0 ? "win" : ""}` },
                  detail.place === 0 ? `Wins ${money(detail.receive)}` : `Pays ${money(detail.pay)}`),
                detail.place !== 0 && total < 10 ? h("div", { className: "stand-flag" }, "under 10 → doubled") : null
              );
            }))
          ),

          game.rounds.length
            ? h("button", {
                type: "button",
                className: "chart-launch",
                onClick: openChart
              },
                h("span", { className: "chart-launch-cards", "aria-hidden": "true" },
                  ["A", "K", "Q", "J"].slice(0, game.players.length).map((card, index) =>
                    h("span", { className: `mini-card ${tone(index)}`, key: card }, card))
                ),
                h("span", { className: "chart-launch-main" },
                  h("strong", null, "Position tracker"),
                  h("span", null, "See how the points and places have moved")
                ),
                h("span", { className: "chart-launch-go", "aria-hidden": "true" }, "↗")
              )
            : null,

          h("section", { className: "card" },
            h("div", { className: "card-head" },
              h("div", null,
                h("h3", { className: "card-title" }, "Round history"),
                h("p", { className: "card-sub" }, "Place and running total are the standings after that round.")
              ),
              game.rounds.length
                ? h(Button, { className: "small ghost", onClick: () => removeRound(game.rounds.length - 1) }, "Undo last")
                : null
            ),
            h("div", { className: "card-body" },
              game.rounds.length
                ? h(React.Fragment, null,
                    game.rounds.slice().map((round, roundIndex) => ({ round, roundIndex })).reverse().map(({ round, roundIndex }) => {
                      const scores = roundScores(round);
                      const event = roundEvent(round);
                      const isEditing = editing === roundIndex;
                      return h("article", { className: "round-item", key: roundIndex },
                        h("div", { className: "round-item-head" },
                          h("div", { className: "row", style: { alignItems: "center" } },
                            h("strong", null, `Round ${roundIndex + 1}`),
                            h(EventPill, { round, players: game.players })
                          ),
                          isEditing
                            ? h("div", { className: "row" },
                                h(Button, { className: "small ghost", onClick: () => setEditing(null) }, "Cancel"),
                                h(Button, { className: "small primary", onClick: saveEdit }, "Save")
                              )
                            : h("div", { className: "row" },
                                event ? null : h(Button, { className: "small ghost", onClick: () => startEdit(roundIndex) }, "Edit"),
                                h(Button, { className: "small danger", onClick: () => removeRound(roundIndex) }, "Delete")
                              )
                        ),
                        isEditing
                          ? h(React.Fragment, null,
                              h("div", { className: "round-edit" }, game.players.map((player, index) =>
                                h("div", { className: `field ${tone(index)}`, key: index },
                                  h("label", { className: "pname" }, player.name),
                                  h("input", {
                                    type: "number",
                                    inputMode: "numeric",
                                    step: 1,
                                    value: editValues[index] != null ? editValues[index] : "",
                                    onChange: (event) => setEditValues((current) =>
                                      current.map((value, position) => position === index ? event.target.value : value))
                                  })
                                )
                              )),
                              editError ? h("div", { className: "field-error" }, editError) : h("div", { className: "hint" }, "Negative numbers are fine for deductions.")
                            )
                          : h("div", { className: `round-scores c${game.players.length}` }, scores.map((score, index) => {
                              const stand = byRound[roundIndex];
                              const spot = stand ? stand.places[index] : null;
                              const prior = roundIndex > 0 && byRound[roundIndex - 1] ? byRound[roundIndex - 1].places[index].place : null;
                              const moved = prior == null || !spot ? 0 : prior - spot.place;
                              return h("div", { className: `round-score ${tone(index)}`, key: index },
                                spot
                                  ? h("div", { className: `round-rank${spot.place === 0 ? " lead" : ""}` },
                                      moved !== 0

                                            className: `round-move ${moved > 0 ? "up" : "down"}`,
                                            title: `Moved ${moved > 0 ? "up" : "down"} ${Math.abs(moved)}`
                                          }, moved > 0 ? "\u25B2" : "\u25BC")
                                        : null,
                                      `${ordinal(spot.place)}${spot.tied ? "=" : ""}`
                                    )
                                  : null,
                                h("span", null, game.players[index].name),
                                h("strong", null,
                                  signedPoints(score),
                                  event && event.player === index ? h("span", { className: "sym-inline" }, handByType[event.type] ? handByType[event.type].symbol : "") : null
                                ),
                                stand ? h("div", { className: "round-total" }, `${stand.totals[index]} pts`) : null
                              );

                    h(HandLegend, { rounds: game.rounds })
                  )
                : h(Empty, { icon: "✎", title: "No rounds yet", body: `Tap "Enter round 1 scores" to get going.` })

              : "Play at least one round before you can settle up.")
          ),
          h(Button, { className: "finish block lg", onClick: onFinish, disabled: !game.rounds.length },
            h("span", { className: "ico", "aria-hidden": "true" }, "\uD83C\uDFC1"), "End game & settle up"),
          h(Button, { className: "quiet block small", onClick: onAbandon }, "Abandon without saving")
        ),
        h("div", { className: "cta-spacer", "aria-hidden": "true" }),

        h(ChartModal, {
          open: chartOpen,
          game,
          byRound,
          animKey,
          onClose: () => setChartOpen(false)
        })
      );
    }

    /* Score entry for one round: normal scores, or a special hand awarded to one player. */
    function ScorePage({ game, onSaveRound }) {
      const [mode, setMode] = useState("scores");
      const [entry, setEntry] = useState(() => new Array(game.players.length).fill(""));
      const [hand, setHand] = useState(null);
      const [awardee, setAwardee] = useState(null);
      const [error, setError] = useState("");

      const totals = useMemo(() => computeTotals(game.players.length, game.rounds), [game.players.length, game.rounds]);
      const roundNumber = game.rounds.length + 1;
      const selectedHand = hand ? handByType[hand] : null;
      const filledCount = entry.filter((value) => String(value == null ? "" : value).trim() !== "").length;

      function setEntryValue(index, value) {
        setError("");
        setEntry((current) => current.map((item, position) => position === index ? value : item));
      }

      function bump(index, delta) {
        setError("");
        setEntry((current) => current.map((value, position) =>
          position === index ? String(Math.round(asNumber(value, 0)) + delta) : value));
      }

      function flipSign(index) {
        setError("");
        setEntry((current) => current.map((value, position) => {
          if (position !== index) return value;
          const number = Math.round(asNumber(value, 0));
          return number === 0 ? value : String(-number);
        }));
      }

      function saveScores() {
        const scores = game.players.map((_, index) => Math.round(asNumber(entry[index], 0)));
        if (scores.every((score) => score === 0)) {
          setError("Every player is on 0 — a round needs at least one score.");
          return;
        }
        onSaveRound({ scores, event: null });
      }

      function saveHand() {
        if (!selectedHand) { setError("Pick which special hand it was."); return; }
        if (awardee == null) { setError("Pick who had the hand."); return; }
        const award = handAward(selectedHand, game.target, totals[awardee]);
        const scores = game.players.map((_, index) => index === awardee ? award : 0);
        onSaveRound({ scores, event: { type: selectedHand.type, player: awardee } });
      }

      return h(React.Fragment, null,
        h("a", { className: "back-link", href: "#/game" }, "← Back to board"),
        h("h2", { className: "page-title", style: { marginTop: 6 } }, `Round ${roundNumber}`),
        h("p", { className: "page-sub" }, "Enter this round's points, or record a special hand."),

        h("div", { className: "segmented", style: { marginBottom: 14 } },
          h("button", { type: "button", "aria-pressed": mode === "scores", onClick: () => { setMode("scores"); setError(""); } }, "Points"),
          h("button", { type: "button", "aria-pressed": mode === "hand", onClick: () => { setMode("hand"); setError(""); } }, "Special hand")
        ),

        mode === "scores"
          ? h("section", { className: "card" },
              h("div", { className: "card-body" },
                game.players.map((player, index) => {
                  const raw = String(entry[index] == null ? "" : entry[index]).trim();
                  const value = Math.round(asNumber(entry[index], 0));
                  const isSet = raw !== "";
                  return h("div", {
                    className: `entry-box ${tone(index)}${isSet ? " filled" : ""}${isSet && value < 0 ? " minus" : ""}`,
                    key: index
                  },
                    h("div", { className: "entry-head" },
                      h(Avatar, { name: player.name, index }),
                      h("div", { className: "entry-name" },
                        h("div", { className: "entry-who", title: player.name }, player.name),
                        h("span", null, `${totals[index]} pts now`)
                      ),
                      isSet
                        ? h("div", { className: "entry-preview" },
                            h("span", { className: "tick", "aria-hidden": "true" }, "✓"),
                            `${totals[index] + value}`)
                        : null
                    ),
                    h("div", { className: "stepper" },
                      h("button", { type: "button", "aria-label": `Decrease ${player.name}`, onClick: () => bump(index, -1) }, "−"),
                      h("input", {
                        type: "number",
                        inputMode: "numeric",
                        step: 1,
                        className: isSet && value < 0 ? "negative" : "",
                        value: entry[index],
                        placeholder: "0",
                        "aria-label": `${player.name} points this round`,
                        onChange: (event) => setEntryValue(index, event.target.value),
                        onFocus: (event) => event.target.select()
                      }),
                      h("button", { type: "button", "aria-label": `Increase ${player.name}`, onClick: () => bump(index, 1) }, "+"),
                      h("button", { type: "button", className: "sign", "aria-label": `Flip sign for ${player.name}`, title: "Make negative / positive", onClick: () => flipSign(index) }, "±")
                    )
                  );
                }),
                h("div", { className: "entry-progress" },
                  h("span", null, `${filledCount} of ${game.players.length} entered`),
                  h("div", { className: "entry-dots", "aria-hidden": "true" }, game.players.map((_, index) =>
                    h("i", { key: index, className: `${tone(index)}${String(entry[index] == null ? "" : entry[index]).trim() !== "" ? " on" : ""}`, style: { "--pc-on": "var(--pc)" } })
                  ))
                ),
                h("p", { className: "hint", style: { marginTop: 8 } }, "Use ± to deduct points for a mistake. Blank boxes count as 0."),
                error ? h("div", { className: "notice", style: { marginTop: 12 } }, error) : null,
                h(Button, { className: "primary block lg", style: { marginTop: 14 }, onClick: saveScores }, `Save round ${roundNumber}`)
              )
            )
          : h("section", { className: "card" },
              h("div", { className: "card-body stack" },
                h("div", null,
                  h("span", { className: "section-label" }, "Which hand?"),
                  h("div", { className: "hand-grid" }, specialHands.map((item) =>
                    h("button", {
                      key: item.type,
                      type: "button",
                      className: `hand-option ${item.wins ? "win" : ""}`,
                      "aria-pressed": hand === item.type,
                      onClick: () => { setHand(item.type); setError(""); }
                    },
                      h("span", { className: "sym" }, item.symbol),
                      h("span", { className: "lbl" }, item.label),
                      h("span", { className: "pts" }, item.toTarget ? `Straight to ${game.target}` : `+${item.points} points`)
                    )
                  ))
                ),
                h("div", null,
                  h("span", { className: "section-label" }, "Who had it?"),
                  h("div", { className: "player-pick" }, game.players.map((player, index) =>
                    h("button", {
                      key: index,
                      type: "button",
                      className: tone(index),
                      "aria-pressed": awardee === index,
                      onClick: () => { setAwardee(index); setError(""); }
                    }, h(Avatar, { name: player.name, index, size: "sm" }), h("span", null, player.name))
                  ))
                ),
                selectedHand && awardee != null
                  ? h("div", { className: "hand-summary" },
                      h("span", { className: "sym" }, selectedHand.symbol),
                      h("div", null,
                        h("strong", null, selectedHand.toTarget
                          ? `${game.players[awardee].name} jumps to ${game.target} and wins`
                          : `${game.players[awardee].name} gets +${selectedHand.points}`),
                        h("span", null, selectedHand.toTarget
                          ? `That is +${handAward(selectedHand, game.target, totals[awardee])} points, straight to the target — the game ends here.`
                          : "Everyone else scores 0 this round.")
                      )
                    )
                  : h("p", { className: "hint" }, "Only one player can be awarded a special hand, and it counts as the whole round."),
                error ? h("div", { className: "notice" }, error) : null,
                h(Button, { className: `block lg ${selectedHand && selectedHand.wins ? "primary" : "primary"}`, onClick: saveHand },
                  selectedHand && selectedHand.wins ? "Save & finish game" : `Save round ${roundNumber}`)
              )
            )
      );
    }

                )),

    /* Full scorecard. Hand symbols sit in the Round column and the awarded player's
       cell is tinted, so score cells only ever hold a number and columns stay aligned. */
    function RoundTable({ record }) {
      const [view, setView] = useState("round");
      const payout = payoutDetails(record.ranked, record.payments || []);
      const winners = new Set(record.ranked.filter((player) => (payout.byIndex[player.index] || {}).place === 0).map((player) => player.index));
      const hasHands = record.rounds.some((round) => roundEvent(round));

      const running = [];
      const acc = new Array(record.players.length).fill(0);
      record.rounds.forEach((round) => {
        roundScores(round).forEach((score, index) => { acc[index] += asNumber(score, 0); });
        running.push(acc.slice());
      });

      function cellClass(value, isAward, isCumulative) {
        const classes = ["num"];
        if (isAward) classes.push("award");
        if (value < 0) classes.push("neg");
        else if (value === 0 && !isAward) classes.push("zero");
        if (isCumulative) classes.push("cum");
        return classes.join(" ");
      }

      return h("section", { className: "card" },
        h("div", { className: "card-head" },
          h("div", null, h("h3", { className: "card-title" }, "Round by round"), h("p", { className: "card-sub" }, view === "round" ? "Points scored in each round." : "Each player's total after every round.")),
          h("div", { className: "segmented mini", role: "group", "aria-label": "Scorecard view" },
            h("button", { type: "button", "aria-pressed": view === "round", onClick: () => setView("round") }, "Per round"),
            h("button", { type: "button", "aria-pressed": view === "total", onClick: () => setView("total") }, "Running total")
          )
        ),
        h("div", { className: "card-body" },
          h("div", { className: "table-wrap" },
            h("table", { className: "scorecard" },
              h("thead", null, h("tr", null,
                h("th", { className: "rc", scope: "col" }, "Round"),
                record.players.map((player, index) =>
                  h("th", { key: index, scope: "col", className: `${tone(index)}${winners.has(index) ? " winner" : ""}` },
                    h("div", { className: "col-head" },
                      h("div", { className: "av-wrap" },
                        h(Avatar, { name: player.name, index, size: "sm" }),
                        winners.has(index) ? h("span", { className: "crown", "aria-label": "Winner" }, "\uD83D\uDC51") : null
                      ),
                      h("span", { title: player.name }, player.name)
                    )
                  )
                )
              )),
              h("tbody", null, record.rounds.map((round, roundIndex) => {
                const event = roundEvent(round);
                const hand = eventHand(round);
                const values = view === "round" ? roundScores(round) : running[roundIndex];
                return h("tr", { key: roundIndex },
                  h("td", { className: "rc" },
                    h("div", { className: "rc-inner" },
                      h("span", null, roundIndex + 1),
                      hand ? h("span", { className: `hand-badge ${hand.wins ? "win" : ""}`, title: hand.label }, hand.symbol) : null
                    )
                  ),
                  values.map((value, index) => {
                    const isAward = Boolean(event) && event.player === index;
                    return h("td", {
                      key: index,
                      className: cellClass(value, isAward, view === "total"),
                      title: isAward && hand ? `${record.players[index].name}: ${hand.label}` : undefined
                    }, view === "round" ? signedPoints(value) : value);
                  })
                );
              })),
              h("tfoot", null, h("tr", null,
                h("td", { className: "rc" }, "Total"),
                record.totals.map((score, index) => h("td", { key: index, className: `num ${winners.has(index) ? "winner" : ""}${score < 0 ? " neg" : ""}` }, score))
              ))
            )
          ),
          hasHands
            ? h("div", { className: "legend" },
                h("span", null, h("i", { className: "legend-swatch", "aria-hidden": "true" }), "Highlighted cell = player awarded the hand"),
                specialHands
                  .filter((hand) => record.rounds.some((round) => roundEvent(round) && roundEvent(round).type === hand.type))
                  .map((hand) => h("span", { key: hand.type }, h("b", null, hand.symbol), hand.wins ? `${hand.label} (wins)` : `${hand.label} (+${hand.points})`))
              )

                h("thead", null, h("tr", null,
                  h("th", null, "Player"), h("th", null, "Games"), h("th", null, "Wins"),

                )),

          ),
          h("div", { className: "card-body" },

                h("thead", null, h("tr", null, h("th", null, "Symbol"), h("th", { style: { textAlign: "left" } }, "Hand"), h("th", null, "Award"))),
                h("tbody", null, specialHands.map((hand) =>
                  h("tr", { key: hand.type },
                    h("td", null, h("b", { style: { color: "var(--brand)" } }, hand.symbol)),
                    h("td", { style: { textAlign: "left", whiteSpace: "normal" } }, h("strong", null, hand.label), h("div", { className: "hint" }, hand.detail)),

    /* ---------- app ---------- */

    function App() {
      const route = useRoute();
      const [history, setHistory] = useState(() => readStore(HISTORY_KEY, []));
      const [game, setGame] = useState(() => {
        const saved = readStore(ACTIVE_KEY, null);
        if (!saved || !saved.players || !saved.players.length) return null;
        return { ...saved, rounds: (saved.rounds || []).map(normalizeRound) };
      });
      const [theme, setTheme] = useState(() => readStore(THEME_KEY, "auto"));
      const [toast, setToast] = useState("");
      const [lastRoundAt, setLastRoundAt] = useState(null);
      const [modal, setModal] = useState(null);
      const toastTimer = useRef(null);

      /* Distinct player names from recent games, most recently played first. */
      const recentNames = useMemo(() => {
        const seen = new Map();
        history.forEach((record) => (record.players || []).forEach((player) => {
          const name = String(player.name || "").trim();
          const key = name.toLowerCase();
          if (name && !seen.has(key)) seen.set(key, name);
        }));
        return Array.from(seen.values());
      }, [history]);

      const systemDark = useMemo(
        () => Boolean(window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches),
        []
      );
      const effectiveTheme = theme === "auto" ? (systemDark ? "dark" : "light") : theme;

      useEffect(() => {
        if (theme === "auto") document.documentElement.removeAttribute("data-theme");
        else document.documentElement.setAttribute("data-theme", theme);
        writeStore(THEME_KEY, theme);
      }, [theme]);

      useEffect(() => {
        if (game) writeStore(ACTIVE_KEY, game);
        else clearStore(ACTIVE_KEY);
      }, [game]);

      const notify = useCallback((message) => {
        setToast(message);
        clearTimeout(toastTimer.current);
        toastTimer.current = setTimeout(() => setToast(""), 2600);
      }, []);

      useEffect(() => () => clearTimeout(toastTimer.current), []);

      const persistHistory = useCallback((next) => {
        const capped = next.slice(0, HISTORY_LIMIT);
        setHistory(capped);
        writeStore(HISTORY_KEY, capped);
      }, []);

      const finishGame = useCallback((current, rounds, winnerIndex = null) => {
        const record = buildRecord(current, rounds, winnerIndex);
        persistHistory([record, ...readStore(HISTORY_KEY, [])]);
        setGame(null);
        navigate("#/results");
      }, [persistHistory]);

      const startGame = useCallback((next) => {
        setGame(next);
        navigate("#/game");
      }, []);

      /* Every change to the rounds goes through here so the end-of-game checks live in one place. */
      const commitRounds = useCallback((rounds, message) => {
        if (!game) return;
        const last = rounds[rounds.length - 1];
        const lastEvent = roundEvent(last);
        if (lastEvent && handByType[lastEvent.type] && handByType[lastEvent.type].wins) {
          finishGame(game, rounds, lastEvent.player);
          return;
        }
        const totals = computeTotals(game.players.length, rounds);
        if (totals.some((total) => total >= game.target)) {
          finishGame(game, rounds);
          return;
        }
        setGame({ ...game, rounds });
        setLastRoundAt(Date.now());
        if (message) notify(message);
      }, [game, finishGame, notify]);

      const saveRound = useCallback((round) => {
        if (!game) return;
        const hand = eventHand(round);
        const event = roundEvent(round);
        const label = hand && event
          ? `${game.players[event.player].name} ${hand.symbol} +${asNumber(roundScores(round)[event.player], 0)}`
          : `Round ${game.rounds.length + 1} saved`;
        navigate("#/game");
        commitRounds([...game.rounds, normalizeRound(round)], label);
      }, [game, commitRounds]);

      const updateRound = useCallback((roundIndex, scores) => {
        if (!game) return;
        commitRounds(game.rounds.map((round, index) => index === roundIndex ? { ...normalizeRound(round), scores } : round));
      }, [game, commitRounds]);

      const deleteRound = useCallback((roundIndex) => {
        if (!game) return;
        setGame({ ...game, rounds: game.rounds.filter((_, index) => index !== roundIndex) });
        notify(`Round ${roundIndex + 1} removed`);
      }, [game, notify]);

      const requestNewGame = useCallback(() => {
        if (game && game.rounds.length) {
          setModal({
            title: "Start a new game?",
            body: "The game in progress has unsaved rounds and will be discarded.",
            confirmLabel: "Discard & continue",
            danger: true,
            onConfirm: () => { setGame(null); setModal(null); navigate("#/setup"); }
          });
          return;
        }
        setGame(null);
        navigate("#/setup");
      }, [game]);

      const requestFinish = useCallback(() => {
        if (!game) return;
        setModal({
          title: "End the game now?",
          body: "Standings are locked in as they stand and the result is saved to your history.",
          confirmLabel: "End game",
          onConfirm: () => { setModal(null); finishGame(game, game.rounds); }
        });
      }, [game, finishGame]);

      const requestAbandon = useCallback(() => {
        setModal({
          title: "Abandon this game?",
          body: "Nothing is saved to history and the scores are lost.",
          confirmLabel: "Abandon",
          danger: true,
          onConfirm: () => { setGame(null); setModal(null); navigate("#/"); }
        });
      }, []);

      const requestClearHistory = useCallback(() => {
        setModal({
          title: "Clear all history?",
          body: "Every saved game and all player stats are permanently removed from this device.",
          confirmLabel: "Clear everything",
          danger: true,
          onConfirm: () => { persistHistory([]); setModal(null); notify("History cleared"); }
        });
      }, [persistHistory, notify]);

      /* "Game" in the nav means: the live board if there is one, otherwise setup.
         Checked against the live hash so a just-finished game lands on #/results. */
      useEffect(() => {
        if (!game && parseHash().name === "game") navigate("#/setup");
      }, [route.name, game]);

      let page = null;
      if (route.name === "setup") {
        page = h(SetupPage, {
          onStart: startGame,
          hasLiveGame: Boolean(game),
          lastGame: history[0] || null,
          recentNames
        });
      } else if (route.name === "game") {
        if (game && route.param === "score") {
          page = h(ScorePage, { key: game.rounds.length, game, onSaveRound: saveRound });
        } else if (game) {
          page = h(BoardPage, {
            game,
            onUpdateRound: updateRound,
            onDeleteRound: deleteRound,
            onFinish: requestFinish,
            onAbandon: requestAbandon,
            notify,
            lastRoundAt
          });
        }
      } else if (route.name === "results") {
        page = h(ResultsPage, { record: history[0] || null, onNewGame: requestNewGame, notify });
      } else if (route.name === "history") {
        page = route.param
          ? h(HistoryDetailPage, { record: history.find((record) => String(record.id || record.date) === route.param) || null, notify })
          : h(HistoryPage, { history, onClear: requestClearHistory, onNewGame: requestNewGame });
      } else if (route.name === "stats") {
        page = h(StatsPage, { history, onNewGame: requestNewGame });
      } else if (route.name === "rules") {
        page = h(RulesPage, { onNewGame: requestNewGame });
      } else {
        page = h(HomePage, {
          game,
          history,
          onResume: () => navigate("#/game"),
          onNewGame: requestNewGame
        });
      }

      return h(React.Fragment, null,
        h(AppBar, { route, theme: effectiveTheme, onToggleTheme: () => setTheme(effectiveTheme === "dark" ? "light" : "dark") }),
        h("main", { className: "shell" }, page),
        h(BottomNav, { route, liveGame: Boolean(game) }),
        h(Modal, {
          open: Boolean(modal),
          title: modal ? modal.title : "",
          body: modal ? modal.body : "",
          confirmLabel: modal ? modal.confirmLabel : "Confirm",
          danger: modal ? modal.danger : false,
          onConfirm: modal ? modal.onConfirm : () => {},
          onCancel: () => setModal(null)
        }),
        toast ? h("div", { className: "toast", role: "status" }, toast) : null
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(h(App));
  </script>
</body>
</html>
